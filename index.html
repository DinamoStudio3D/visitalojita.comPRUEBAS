<script>
(function(){
    const allowedIcons=new Set(['fa-earth-americas','fa-map-location-dot','fa-route','fa-mountain-sun','fa-camera-retro']);
    const defaults={active:true,startDate:'2026-09-27T00:00:00-05:00',endDate:'2026-09-27T23:59:59-05:00',dateLabel:'27 de septiembre',name:'Día Mundial del Turismo',title:'Celebremos a Loja:',highlight:'cada sabor cuenta una historia',description:'El turismo conecta personas, cultura, sabores y comunidades. Este 27 de septiembre te invitamos a recorrer Loja, apoyar a sus negocios locales y descubrir los lugares que hacen única a nuestra ciudad.',chabaquitoMessage:'Celebremos nuestra identidad recorriendo, saboreando y cuidando Loja. ¡Te espero en la ruta!',card1Title:'Saborea Loja',card1Text:'Visita cafeterías y restaurantes.',card2Title:'Vive su cultura',card2Text:'Conoce historias y tradiciones.',card3Title:'Apoya lo local',card3Text:'Elige emprendimientos lojanos.',primaryButtonLabel:'Explorar Loja',primaryButtonUrl:'#mapa',secondaryButtonLabel:'Iniciar mi Pasaporte',secondaryButtonUrl:'#pasaporte',badgeBefore:'Faltan',badgeLive:'¡Hoy celebramos el turismo!',badgeAfter:'Seguimos celebrando y viviendo Loja',afterTitle:'Loja se vive todo el año',afterDescription:'Continúa descubriendo sus sabores, cultura, emprendimientos y destinos.',shareText:'Este 27 de septiembre celebremos el Día Mundial del Turismo recorriendo, saboreando y viviendo Loja con Visita Loja.',icon:'fa-earth-americas',primaryColor:'#34d399',secondaryColor:'#f97316',backgroundColor:'#071f1b'};
    let config={...defaults},timer=null;
    const setText=(id,value)=>{const element=document.getElementById(id);if(element)element.textContent=value;};
    const safeColor=(value,fallback)=>/^#[0-9a-f]{6}$/i.test(String(value||''))?value:fallback;
    const safeUrl=(value,fallback)=>{try{const url=new URL(value||fallback,location.href);return ['http:','https:'].includes(url.protocol)||String(value||fallback).startsWith('#')?(value||fallback):fallback;}catch(_){return fallback;}};
    function render(){
        const section=document.getElementById('dia-turismo');if(!section)return;
        section.classList.toggle('hidden',config.active===false);
        const primary=safeColor(config.primaryColor,defaults.primaryColor),secondary=safeColor(config.secondaryColor,defaults.secondaryColor),background=safeColor(config.backgroundColor,defaults.backgroundColor);
        section.style.background=`linear-gradient(135deg,${background},#0b3028,#121212)`;
        section.style.borderColor=primary+'55';
        const glow=document.getElementById('tourismCampaignGlow');if(glow)glow.style.background=`radial-gradient(circle at 15% 20%,${primary} 0,transparent 28%),radial-gradient(circle at 85% 80%,${secondary} 0,transparent 30%)`;
        const icon=document.getElementById('tourismCampaignIcon');if(icon)icon.className=`fa-solid ${allowedIcons.has(config.icon)?config.icon:defaults.icon}`;
        setText('tourismCampaignDateLabel',config.dateLabel);setText('tourismCampaignName',config.name);setText('tourismCampaignTitle',config.title);setText('tourismCampaignHighlight',config.highlight);setText('tourismCampaignDescription',config.description);
        setText('tourismCard1Title',config.card1Title);setText('tourismCard1Text',config.card1Text);setText('tourismCard2Title',config.card2Title);setText('tourismCard2Text',config.card2Text);setText('tourismCard3Title',config.card3Title);setText('tourismCard3Text',config.card3Text);
        setText('tourismCampaignMessage','“'+config.chabaquitoMessage+'”');
        const highlight=document.getElementById('tourismCampaignHighlight'),brand=document.getElementById('tourismCampaignBrand'),messageLabel=document.getElementById('tourismChabaquitoLabel');if(highlight)highlight.style.color=primary;if(brand)brand.style.color=primary;if(messageLabel)messageLabel.style.color=secondary;
        const main=document.getElementById('tourismPrimaryButton'),secondaryButton=document.getElementById('tourismSecondaryButton'),share=document.getElementById('tourismShareButton');
        if(main){main.href=safeUrl(config.primaryButtonUrl,defaults.primaryButtonUrl);main.querySelector('span').textContent=config.primaryButtonLabel;main.style.backgroundColor=primary;}
        if(secondaryButton){secondaryButton.href=safeUrl(config.secondaryButtonUrl,defaults.secondaryButtonUrl);}
        if(share)share.style.backgroundColor=secondary;
        updateClock();
    }
    function updateClock(){
        const now=Date.now(),start=new Date(config.startDate).getTime(),end=new Date(config.endDate).getTime(),title=document.getElementById('tourismDayCountdownTitle'),countdown=document.getElementById('tourismDayCountdown');
        if(!title||!Number.isFinite(start)||!Number.isFinite(end))return;
        if(now>=start&&now<=end){title.textContent=config.badgeLive;countdown.classList.remove('hidden');['tourismDays','tourismHours','tourismMinutes','tourismSeconds'].forEach(id=>setText(id,'00'));return;}
        if(now>end){title.textContent=config.badgeAfter;countdown.classList.add('hidden');setText('tourismCampaignTitle',config.afterTitle);setText('tourismCampaignHighlight','');setText('tourismCampaignDescription',config.afterDescription);return;}
        title.textContent=config.badgeBefore;countdown.classList.remove('hidden');

        setText('tourismDays',String(days).padStart(2,'0'));setText('tourismHours',String(hours).padStart(2,'0'));setText('tourismMinutes',String(minutes).padStart(2,'0'));setText('tourismSeconds',String(seconds).padStart(2,'0'));
    }
    window.applyTourismDayConfiguration=function(data){config={...defaults,...(data&&typeof data==='object'?data:{})};render();if(timer)clearInterval(timer);timer=setInterval(updateClock,1000);};
    window.shareTourismDay=function(){const url=location.origin+location.pathname+'#dia-turismo';if(navigator.share){navigator.share({title:config.name,text:config.shareText,url}).catch(()=>{});return;}window.open('https://wa.me/?text='+encodeURIComponent(config.shareText+' '+url),'_blank','noopener');};

})();

                <div class="bg-black/40 border border-gray-800 p-5 rounded-2xl">
                    <h4 class="font-bold text-sm text-brandGold mb-4"><i class="fa-solid fa-gear mr-1"></i> Textos y Marcas Predeterminadas</h4>
                    <form onsubmit="handleSavePostcardSettings(event)" class="space-y-4">
                        <div>
                            <label class="block text-[10px] text-brandGold mb-1 uppercase font-bold">Texto de Marca / Watermark Inferior</label>
                            <input type="text" id="setPostcardWatermark" required placeholder="VISITA LOJA • FIAVL 2026" class="w-full bg-[#121212] border border-brandGold/50 rounded-xl p-2.5 text-xs text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-1 uppercase font-semibold">URL de Foto de Muestra / Default (Fondo)</label>
                            <input type="text" id="setPostcardSampleImg" required placeholder="https://..." class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-1 uppercase font-semibold">Frase Predeterminada para Turistas</label>
                            <input type="text" id="setPostcardDefaultMsg" placeholder="¡Enamorándome de los sabores de Loja!" class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none">
                        </div>
                        <button type="submit" class="w-full bg-brandGold text-white font-bold py-3 rounded-xl hover:bg-brandGoldHover transition text-xs uppercase tracking-wider">
                            Guardar Ajustes de Postales
                        </button>
                    </form>
                </div>
            </div>

            <!-- Carrusel de Fondo, Vídeo y Logo Tab -->
            <div id="adminTabIdentidad" class="space-y-6 hidden">
                <div class="bg-black/40 border border-gray-800 p-5 rounded-2xl">
                    <h4 class="font-bold text-sm text-brandGold mb-4"><i class="fa-solid fa-images mr-1"></i> Configurar Carrusel de Fondo y Medios</h4>
                    <form onsubmit="handleSaveBrandingSettings(event)" class="space-y-4">
                        <div>
                            <label class="block text-[10px] text-brandGold mb-1 uppercase font-bold"><i class="fa-solid fa-list mr-1"></i> URLs de las Imágenes del Carrusel (Separadas por comas)</label>
                            <textarea id="setHeroBgUrlsInput" oninput="updateCarouselPreviewFromInput()" rows="3" required placeholder="https://i.imgur.com/0QSbhqQ.jpeg, https://images.unsplash.com/..." class="w-full bg-[#121212] border border-brandGold/50 rounded-xl p-2.5 text-xs text-white outline-none"></textarea>
                            <span class="text-[9px] text-gray-400 mt-1 block">💡 El sistema rotará estas imágenes automáticamente según los segundos que configures abajo.</span>
                        </div>

                        <div>
                            <label class="block text-[10px] text-brandGold mb-1 uppercase font-bold"><i class="fa-solid fa-stopwatch mr-1"></i> Tiempo de cambio entre imágenes (segundos)</label>
                            <input type="number" id="setHeroIntervalSeconds" min="2" max="60" value="6" class="w-full sm:w-48 bg-[#121212] border border-brandGold/50 rounded-xl p-2.5 text-xs text-white outline-none">
                        </div>
                        
                        <div class="bg-black/60 p-4 rounded-xl border border-brandGold/40 space-y-3">
                            <label class="block text-xs text-brandGold font-bold uppercase"><i class="fa-solid fa-hand mr-1"></i> Previsualización Interactiva (Arrastre para encuadre)</label>
                            <p class="text-[10px] text-gray-300">Haz clic y arrastra con el mouse (o desliza con el dedo) para encuadrar la imagen de fondo principal.</p>
                            
                            <div id="interactivePreviewBox" class="w-full h-48 rounded-lg overflow-hidden relative border-2 border-brandGold bg-black shadow-inner cursor-grab active:cursor-grabbing select-none" onmousedown="startDragBg(event)" ontouchstart="startDragBg(event)">
                                <img id="previewHeroImg" src="https://i.imgur.com/0QSbhqQ.jpeg" alt="Preview" class="absolute w-full h-auto min-h-full pointer-events-none transition-none" style="object-fit: cover; left: 0px; top: 0px;" decoding="async" loading="lazy">
                                <div class="absolute inset-0 bg-black/20 pointer-events-none flex items-center justify-center">
                                    <span class="text-[10px] bg-black/70 text-brandGold font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-brandGold/40 shadow">Arrastra para encuadrar</span>
                                </div>
                            </div>

                            <input type="hidden" id="setHeroBgPosition" value="50% 50%">

                            <div class="flex justify-between items-center pt-2">
                                <span class="text-[10px] text-gray-400">Posición guardada: <strong id="posCoordText" class="text-brandGold">50% 50%</strong></span>
                                <button type="button" onclick="resetBgPosition()" class="bg-gray-800 text-brandGold text-[10px] font-bold px-3 py-1 rounded border border-gray-700 hover:bg-brandGold hover:text-white transition">Centrar automático</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] text-brandGold mb-1 uppercase font-bold"><i class="fa-brands fa-youtube mr-1"></i> Enlace del Vídeo (YouTube)</label>
                            <input type="text" id="setLatestYoutubeUrl" required placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-brandGold">
                        </div>
                        <div>
                            <label class="block text-[10px] text-brandGold mb-1 uppercase font-bold">Título del Vídeo Destacado</label>
                            <input type="text" id="setLatestYoutubeTitle" required placeholder="Ej. La Virgen del Cisne en Loja" class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-brandGold">
                        </div>
                        <div>
                            <label class="block text-[10px] text-brandGold mb-1 uppercase font-bold"><i class="fa-solid fa-image mr-1"></i> Miniatura del Vídeo</label>
                            <input type="text" id="setLatestVideoThumbUrl" required placeholder="https://images.unsplash.com/..." class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-brandGold">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-1 uppercase font-semibold">URL del Logotipo Oficial</label>
                            <input type="text" id="setBrandLogoUrl" required class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none">
                        </div>
                        <button type="submit" class="w-full bg-brandGold text-white font-bold py-3 rounded-xl hover:bg-brandGoldHover transition text-xs uppercase tracking-wider">
                            Aplicar Cambios al Instante
                        </button>
                    </form>
                </div>
            </div>

            <!-- Popup Tab -->
            <div id="adminTabPopup" class="space-y-6 hidden">
                <div class="bg-black/40 border border-gray-800 p-5 rounded-2xl">
                    <h4 class="font-bold text-sm text-brandGold mb-4"><i class="fa-solid fa-bullhorn mr-1"></i> Configurar Notificación / Popup</h4>
                    <form onsubmit="handleSavePopupSettings(event)" class="space-y-4">
                        <div class="flex items-center justify-between bg-brandGold/10 p-3 rounded-xl border border-brandGold/30">
                            <span class="text-xs font-bold text-brandGold">Activar Popup Notificación en la Web</span>
                            <input type="checkbox" id="setPopupActive" class="w-5 h-5 accent-brandGold cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-[10px] text-brandGold mb-1 uppercase font-bold">Título del Anuncio</label>
                            <input type="text" id="setPopupTitle" required placeholder="Ej. ¡Especial del Día de las Madres!" class="w-full bg-[#121212] border border-brandGold/50 rounded-xl p-2.5 text-xs text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-1 uppercase font-semibold">Mensaje / Descuento</label>
                            <textarea id="setPopupDesc" required rows="3" placeholder="Descripción de la promoción..." class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-1 uppercase font-semibold">URL de la Imagen del Popup</label>
                            <input type="text" id="setPopupImg" required placeholder="https://images.unsplash.com/..." class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-1 uppercase font-semibold">Enlace de WhatsApp (Opcional)</label>
                            <input type="text" id="setPopupWhatsapp" placeholder="https://wa.me/593..." class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs text-white outline-none">
                        </div>
                        <button type="submit" class="w-full bg-brandGold text-white font-bold py-3 rounded-xl hover:bg-brandGoldHover transition text-xs uppercase tracking-wider">
                            Guardar y Publicar Popup
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</template>
